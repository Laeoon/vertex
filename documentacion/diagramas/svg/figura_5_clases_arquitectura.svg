<svg width="920" height="740" viewBox="0 0 920 740" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
      <defs>
        <!-- Flecha de Asociación / Dependencia -->
        <marker id="arr-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/>
        </marker>
        <!-- Rombo de Agregación (Vacío) -->
        <marker id="diamond-aggr" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <polygon points="6,1 11,6 6,11 1,6" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
        </marker>
        <!-- Rombo de Composición (Relleno) -->
        <marker id="diamond-comp" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <polygon points="6,1 11,6 6,11 1,6" fill="#111827" stroke="#111827" stroke-width="1.2"/>
        </marker>
      </defs>

      <!-- PAQUETE: DOMINIO & CONTROLADORES (SUPERIOR) -->
      
      <!-- Clase: GameLogic -->
      <g transform="translate(40, 30)">
        <rect x="0" y="0" width="230" height="150" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="230" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="115" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GameLogic</text>
        <text x="8" y="44" font-size="9" fill="#111827">- _game: JuegoAtaque</text>
        <text x="8" y="58" font-size="9" fill="#111827">- _brain: DefenderBrain</text>
        <line x1="0" y1="66" x2="230" y2="66" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="82" font-size="9" fill="#111827">+ defender_block_edge(key: String)</text>
        <text x="8" y="96" font-size="9" fill="#111827">+ defender_quarantine_node(id)</text>
        <text x="8" y="110" font-size="9" fill="#111827">+ select_neighbor_directional(dir)</text>
        <text x="8" y="124" font-size="9" fill="#111827">+ reveal_optimal_route()</text>
        <text x="8" y="138" font-size="9" fill="#111827">+ mover_jugador(destino)</text>
      </g>

      <!-- Clase: DefenderBrain (Focal de Dominio) -->
      <g transform="translate(340, 30)">
        <rect x="0" y="0" width="250" height="185" fill="#f9fafb" stroke="#111827" stroke-width="1.6"/>
        <rect x="0" y="0" width="250" height="26" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
        <text x="125" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">DefenderBrain</text>
        <text x="8" y="44" font-size="9" fill="#111827">+ forensics_trace: float = 0.0</text>
        <text x="8" y="58" font-size="9" fill="#111827">+ quarantined_nodes: Dictionary</text>
        <text x="8" y="72" font-size="9" fill="#111827">+ enemy_pos: StringName</text>
        <text x="8" y="86" font-size="9" fill="#111827">+ enemy_path: Array[StringName]</text>
        <text x="8" y="100" font-size="9" fill="#111827">+ fog_of_war: bool = false</text>
        <line x1="0" y1="108" x2="250" y2="108" stroke="#d1d5db" stroke-width="1"/>
        <text x="8" y="124" font-size="9" fill="#111827">+ block_edge(key: String): void</text>
        <text x="8" y="138" font-size="9" fill="#111827">+ resolve_turn(): void</text>
        <text x="8" y="152" font-size="9" fill="#111827">+ move_enemy(): void</text>
        <text x="8" y="166" font-size="9" fill="#111827">+ quarantine_node(id): void</text>
        <text x="8" y="180" font-size="9" fill="#111827">+ calcular_estrellas(): int</text>
      </g>

      <!-- Clase: GameRenderer -->
      <g transform="translate(660, 30)">
        <rect x="0" y="0" width="220" height="150" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="220" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GameRenderer</text>
        <text x="8" y="44" font-size="9" fill="#111827">- _canvas: CanvasItem</text>
        <text x="8" y="58" font-size="9" fill="#111827">- font: Font</text>
        <line x1="0" y1="66" x2="220" y2="66" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="82" font-size="9" fill="#111827">+ draw_frame(d: Dictionary)</text>
        <text x="8" y="96" font-size="9" fill="#111827">+ draw_nodes(...)</text>
        <text x="8" y="110" font-size="9" fill="#111827">+ draw_edges(...)</text>
        <text x="8" y="124" font-size="9" fill="#111827">+ draw_defender_hud(...)</text>
        <text x="8" y="138" font-size="9" fill="#111827">+ draw_background_grid(...)</text>
      </g>

      <!-- PAQUETE: CORE ALGORÍTMICO Y RUNTIME (CENTRAL) -->

      <!-- Clase: NetworkRuntime (Estado mutable O(1)) -->
      <g transform="translate(340, 275)">
        <rect x="0" y="0" width="250" height="155" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
        <rect x="0" y="0" width="250" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
        <text x="125" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">NetworkRuntime</text>
        <text x="8" y="44" font-size="9" fill="#111827">+ graph: NetworkGraphResource</text>
        <text x="8" y="58" font-size="9" fill="#111827">- _adjacency: Dictionary [O(1)]</text>
        <text x="8" y="72" font-size="9" fill="#111827">+ node_threat_levels: Dictionary</text>
        <line x1="0" y1="80" x2="250" y2="80" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="96" font-size="9" fill="#111827">+ set_transit_cost(u, v, cost)</text>
        <text x="8" y="110" font-size="9" fill="#111827">+ get_transit_cost(u, v): float</text>
        <text x="8" y="124" font-size="9" fill="#111827">+ get_neighbors(u): Array</text>
        <text x="8" y="138" font-size="9" fill="#111827">+ isolate_node(id): void</text>
      </g>

      <!-- Clase: DefensivePathfinder (Dijkstra) -->
      <g transform="translate(40, 275)">
        <rect x="0" y="0" width="230" height="110" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="230" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="115" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">&lt;&lt;utility&gt;&gt; DefensivePathfinder</text>
        <text x="8" y="44" font-size="9" fill="#6b7280">{stateless / functional}</text>
        <line x1="0" y1="52" x2="230" y2="52" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="70" font-size="9" fill="#111827">+ find_path(g, s, t): Array</text>
        <text x="8" y="86" font-size="9" fill="#111827">+ find_path_with_cost(...): Dict</text>
        <text x="8" y="102" font-size="9" fill="#111827">- _dijkstra(g, s, t, rt): _Result</text>
      </g>

      <!-- Clase: StrategicAnalyzer (Edmonds-Karp / Min-Cut) -->
      <g transform="translate(660, 275)">
        <rect x="0" y="0" width="220" height="110" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="220" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">&lt;&lt;utility&gt;&gt; StrategicAnalyzer</text>
        <text x="8" y="44" font-size="9" fill="#6b7280">{stateless / max-flow}</text>
        <line x1="0" y1="52" x2="220" y2="52" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="70" font-size="9" fill="#111827">+ find_min_cut(g, s, t): Dict</text>
        <text x="8" y="86" font-size="9" fill="#111827">+ get_max_flow(g, s, t): float</text>
        <text x="8" y="102" font-size="9" fill="#111827">- _edmonds_karp(...): Dict</text>
      </g>

      <!-- PAQUETE: MODELO DE DATOS INMUTABLES (RECURSOS .TRES) (INFERIOR) -->

      <!-- Clase: NetworkGraphResource -->
      <g transform="translate(340, 500)">
        <rect x="0" y="0" width="250" height="120" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
        <rect x="0" y="0" width="250" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
        <text x="125" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">NetworkGraphResource</text>
        <text x="8" y="44" font-size="9" fill="#111827">+ nodes: Array[NetworkNodeResource]</text>
        <text x="8" y="58" font-size="9" fill="#111827">+ edges: Array[NetworkEdgeResource]</text>
        <text x="8" y="72" font-size="9" fill="#111827">+ directed: bool = true</text>
        <line x1="0" y1="80" x2="250" y2="80" stroke="#e5e7eb" stroke-width="1"/>
        <text x="8" y="96" font-size="9" fill="#111827">+ get_node_by_id(id): Resource</text>
        <text x="8" y="110" font-size="9" fill="#111827">+ get_edges_from(id): Array</text>
      </g>

      <!-- Clase: NetworkNodeResource -->
      <g transform="translate(40, 510)">
        <rect x="0" y="0" width="230" height="105" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="230" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="115" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">NetworkNodeResource</text>
        <text x="8" y="44" font-size="9" fill="#111827">+ id: StringName</text>
        <text x="8" y="58" font-size="9" fill="#111827">+ display_name: String</text>
        <text x="8" y="72" font-size="9" fill="#111827">+ node_type: int (0..5)</text>
        <text x="8" y="86" font-size="9" fill="#111827">+ metadata: Dictionary</text>
      </g>

      <!-- Clase: NetworkEdgeResource -->
      <g transform="translate(660, 510)">
        <rect x="0" y="0" width="220" height="105" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
        <rect x="0" y="0" width="220" height="26" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
        <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">NetworkEdgeResource</text>
        <text x="8" y="44" font-size="9" fill="#111827">+ from_id: StringName</text>
        <text x="8" y="58" font-size="9" fill="#111827">+ to_id: StringName</text>
        <text x="8" y="72" font-size="9" fill="#111827">+ transit_cost: float = 1.0</text>
        <text x="8" y="86" font-size="9" fill="#111827">+ mitigation_capacity: float = 1.0</text>
      </g>

      <!-- RELACIONES DE ASOCIACIÓN, AGREGACIÓN Y COMPOSICIÓN -->
      
      <!-- GameLogic -> DefenderBrain (Agregación) -->
      <line x1="270" y1="105" x2="340" y2="105" stroke="#111827" stroke-width="1.3" marker-start="url(#diamond-aggr)"/>
      <text x="290" y="98" font-size="9" fill="#4b5563">1</text>
      <text x="325" y="98" font-size="9" fill="#4b5563">1</text>

      <!-- DefenderBrain -> NetworkRuntime (Uso / Dependencia) -->
      <line x1="465" y1="215" x2="465" y2="275" stroke="#111827" stroke-width="1.3" marker-end="url(#arr-dep)"/>
      <text x="472" y="245" font-size="9" fill="#4b5563">&lt;&lt;use&gt;&gt;</text>

      <!-- DefenderBrain -> DefensivePathfinder (Dependencia) -->
      <path d="M 340 150 H 155 V 275" stroke="#111827" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-dep)"/>
      <text x="162" y="245" font-size="8.5" fill="#4b5563">&lt;&lt;call&gt;&gt;</text>

      <!-- DefenderBrain -> StrategicAnalyzer (Dependencia) -->
      <path d="M 590 150 H 770 V 275" stroke="#111827" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-dep)"/>
      <text x="778" y="245" font-size="8.5" fill="#4b5563">&lt;&lt;call&gt;&gt;</text>

      <!-- NetworkRuntime -> NetworkGraphResource (Composición / Involucra grafo) -->
      <line x1="465" y1="430" x2="465" y2="500" stroke="#111827" stroke-width="1.4" marker-start="url(#diamond-comp)"/>
      <text x="472" y="465" font-size="9" fill="#4b5563">1..1</text>

      <!-- NetworkGraphResource -> NetworkNodeResource (Composición 1..*) -->
      <line x1="340" y1="560" x2="270" y2="560" stroke="#111827" stroke-width="1.3" marker-start="url(#diamond-comp)"/>
      <text x="320" y="552" font-size="9" fill="#4b5563">1</text>
      <text x="280" y="552" font-size="9" fill="#4b5563">1..*</text>

      <!-- NetworkGraphResource -> NetworkEdgeResource (Composición 1..*) -->
      <line x1="590" y1="560" x2="660" y2="560" stroke="#111827" stroke-width="1.3" marker-start="url(#diamond-comp)"/>
      <text x="600" y="552" font-size="9" fill="#4b5563">1</text>
      <text x="640" y="552" font-size="9" fill="#4b5563">1..*</text>

      <!-- Leyenda Formal -->
      <g transform="translate(50, 680)">
        <text x="0" y="10" font-size="9.5" font-weight="700" fill="#111827">Notación UML:</text>
        
        <polygon points="90,5 95,10 90,15 85,10" fill="#111827" stroke="#111827"/>
        <text x="105" y="12" font-size="9" fill="#374151">Composición fuerte</text>

        <polygon points="230,5 235,10 230,15 225,10" fill="#ffffff" stroke="#111827"/>
        <text x="245" y="12" font-size="9" fill="#374151">Agregación</text>

        <line x1="340" y1="10" x2="370" y2="10" stroke="#111827" stroke-width="1.2" marker-end="url(#arr-dep)"/>
        <text x="378" y="12" font-size="9" fill="#374151">Asociación dirigida</text>

        <line x1="500" y1="10" x2="530" y2="10" stroke="#111827" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-dep)"/>
        <text x="538" y="12" font-size="9" fill="#374151">Dependencia / Uso</text>
      </g>
    </svg>