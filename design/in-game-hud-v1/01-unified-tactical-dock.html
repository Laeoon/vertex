<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VERTEX HUD — 01 Unified Tactical Dock</title>
<style>
  :root {
    --bg: #0d0e16;
    --bg-heist: #120918;
    --bg-hacker: #09120e;
    --bg-cyber: #081018;
    --panel: rgba(22, 24, 38, 0.88);
    --panel-solid: rgba(16, 18, 31, 0.95);
    --panel-border: #2a2e4a;
    --accent: #00e5ff;
    --enemy: #ff2e88;
    --success: #39ff88;
    --warning: #ffc857;
    --danger: #ff4757;
    --text: #eaecf5;
    --text-dim: #8a90b8;
    --world-heist: #bf5af2;
    --world-hacker: #39ff88;
    --world-cyber: #00d2ff;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1356px;
    height: 672px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* Mode Switcher Bar (for previewing all 3 modes in the artboard) */
  .preview-switcher {
    position: fixed;
    top: 58px;
    left: 16px;
    z-index: 100;
    display: flex;
    gap: 6px;
    background: var(--panel-solid);
    border: 1px solid var(--panel-border);
    padding: 4px;
    border-radius: 4px;
  }
  .preview-switcher button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 3px;
  }
  .preview-switcher button.active {
    background: rgba(0, 229, 255, 0.14);
    border-color: var(--accent);
    color: var(--text);
    font-weight: 700;
  }

  /* 1. SINGLE UNIFIED TOP TELEMETRY BAR (48px, Read-Only, Zero Action Buttons) */
  header.top-bar {
    height: 48px;
    background: var(--panel-solid);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
  }
  .top-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .mode-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    border: 1px solid currentColor;
  }
  .level-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .top-center {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 13px;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-label { color: var(--text-dim); font-size: 11px; }
  .stat-val { color: var(--text); font-weight: 700; }
  .meter-track {
    width: 110px;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--panel-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill { height: 100%; transition: width 0.2s ease; }

  .top-right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
  }
  .target-pill {
    padding: 4px 10px;
    border-radius: 3px;
    background: rgba(255, 71, 87, 0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-weight: 700;
    font-size: 12px;
  }

  /* 2. GRAPH CANVAS AREA (100% clean, single inspector card top-right) */
  main.canvas-area {
    flex: 1;
    position: relative;
    background-image:
      linear-gradient(to right, rgba(42, 46, 74, 0.22) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(42, 46, 74, 0.22) 1px, transparent 1px);
    background-size: 64px 64px;
    overflow: hidden;
  }
  svg.topology {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Single Node Inspector Card (Top-Right — NO second Hacker box below it!) */
  aside.node-inspector {
    position: absolute;
    top: 14px;
    right: 20px;
    width: 210px;
    background: var(--panel);
    border: 1px solid var(--accent);
    padding: 12px 14px;
    border-radius: 4px;
  }
  .insp-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .insp-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .insp-desc { font-size: 11px; color: var(--text-dim); margin-top: 6px; border-top: 1px solid var(--panel-border); padding-top: 6px; }

  /* 3. SINGLE UNIFIED BOTTOM TACTICAL DOCK (54px, Dynamic Flex Spacing, Zero Overlaps) */
  footer.bottom-dock {
    height: 54px;
    background: var(--panel-solid);
    border-top: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
  }
  .dock-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dock-center {
    display: flex;
    align-items: center;
    gap: 10px; /* Guaranteed 10px separation — impossible to overlap! */
  }
  .dock-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tactical-btn {
    height: 38px;
    padding: 0 14px;
    background: rgba(22, 24, 38, 0.95);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tactical-btn:hover {
    border-color: var(--accent);
  }
  .tactical-btn.active {
    background: rgba(0, 229, 255, 0.16);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tactical-btn.primary-cta {
    background: rgba(57, 255, 136, 0.16);
    border-color: var(--success);
    color: var(--success);
    padding: 0 20px;
  }
  .tactical-btn.disabled {
    opacity: 0.42;
    cursor: not-allowed;
  }
  .keycap {
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 2px;
    background: rgba(255,255,255,0.09);
    color: var(--text-dim);
  }
  .cam-btn {
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    background: rgba(22, 24, 38, 0.95);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- Interactive Mode Switcher to test Heist, Hacker, and Cybersecurity in one Artboard -->
  <nav class="preview-switcher" aria-label="Selector de modo de prueba">
    <button id="btn-heist" onclick="setMode('heist')">MODO 1: HEIST (VEX)</button>
    <button id="btn-hacker" class="active" onclick="setMode('hacker')">MODO 2: HACKER (N0X)</button>
    <button id="btn-cyber" onclick="setMode('cyber')">MODO 3: CYBERSECURITY (AEGIS)</button>
  </nav>

  <!-- 1. TOP TELEMETRY BAR (Strictly Telemetry — No colliding buttons!) -->
  <header class="top-bar" id="top-bar">
    <div class="top-left">
      <span class="mode-badge" id="mode-badge" style="color: var(--world-hacker);">HACKER // N0X</span>
      <span class="level-title" id="level-title">Lateral Movement</span>
    </div>

    <div class="top-center" id="top-telemetry">
      <!-- Populated per mode -->
    </div>

    <div class="top-right">
      <span style="color: var(--text-dim); font-size: 12px;" id="pos-label">POS: DMZ</span>
      <span class="target-pill" id="target-pill">META: WebServer</span>
    </div>
  </header>

  <!-- 2. CLEAN TOPOLOGY CANVAS -->
  <main class="canvas-area" id="canvas-area">
    <svg class="topology" viewBox="0 0 1356 570" aria-label="Grafo de red">
      <!-- Edges -->
      <line x1="120" y1="270" x2="270" y2="140" stroke="#2a2e4a" stroke-width="2.5" />
      <line x1="120" y1="270" x2="270" y2="410" stroke="#2a2e4a" stroke-width="2.5" />
      <line x1="270" y1="140" x2="470" y2="140" stroke="#2a2e4a" stroke-width="2.5" />
      <line x1="470" y1="140" x2="670" y2="140" stroke="#2a2e4a" stroke-width="2.5" />
      <line x1="670" y1="140" x2="770" y2="330" stroke="#2a2e4a" stroke-width="2.5" />
      <line x1="770" y1="330" x2="940" y2="240" stroke="#2a2e4a" stroke-width="2.5" />

      <!-- Edge Protocol Pills -->
      <g transform="translate(175, 190)">
        <rect x="-26" y="-10" width="52" height="18" rx="2" fill="#10121f" stroke="#2a2e4a"/>
        <text x="0" y="3" fill="#8a90b8" font-size="10" text-anchor="middle">HTTPS</text>
      </g>
      <g transform="translate(370, 140)">
        <rect x="-34" y="-10" width="68" height="18" rx="2" fill="#10121f" stroke="#2a2e4a"/>
        <text x="0" y="3" fill="#8a90b8" font-size="10" text-anchor="middle">INTERNAL</text>
      </g>

      <!-- Player Node (DMZ) -->
      <g transform="translate(120, 270)">
        <circle r="28" fill="rgba(0,229,255,0.18)" stroke="#00e5ff" stroke-width="2.5"/>
        <circle r="6" fill="#eaecf5"/>
        <rect x="-22" y="-48" width="44" height="18" rx="2" fill="#10121f" stroke="#00e5ff"/>
        <text x="0" y="-35" fill="#00e5ff" font-size="12" font-weight="700" text-anchor="middle">DMZ</text>
        <text x="0" y="44" fill="#00e5ff" font-size="11" font-weight="700" text-anchor="middle">YOU</text>
      </g>

      <!-- Selected Neighbor / Target Node (WebServer) — Notice badge is BELOW node so it NEVER overlaps the title! -->
      <g transform="translate(270, 140)">
        <circle r="32" fill="rgba(255,71,87,0.15)" stroke="#ffc857" stroke-width="2" stroke-dasharray="5,3"/>
        <circle r="25" fill="#ff4757"/>
        <!-- Node Title cleanly above -->
        <rect x="-42" y="-48" width="84" height="18" rx="2" fill="#10121f" stroke="#ff4757"/>
        <text x="0" y="-35" fill="#eaecf5" font-size="12" font-weight="700" text-anchor="middle">WebServer</text>
        <!-- Predictive Cost Badge cleanly BELOW the node (never colliding with adjacent node titles!) -->
        <rect x="-68" y="36" width="136" height="22" rx="3" fill="#10121f" stroke="#00e5ff" stroke-width="1.5"/>
        <text x="0" y="51" fill="#00e5ff" font-size="11" font-weight="700" text-anchor="middle">Δ COSTE: 1.0 → [MOVER]</text>
      </g>

      <!-- Neighbor 2 (Mail Server) -->
      <g transform="translate(270, 410)">
        <circle r="24" fill="#39ff88" stroke="#eaecf5" stroke-width="1.5"/>
        <rect x="-46" y="-44" width="92" height="18" rx="2" fill="#10121f" stroke="#39ff88"/>
        <text x="0" y="-31" fill="#39ff88" font-size="12" font-weight="700" text-anchor="middle">Mail Server</text>
      </g>

      <!-- Other Nodes -->
      <g transform="translate(470, 140)">
        <circle r="22" fill="#2a2e4a"/>
        <text x="0" y="-30" fill="#eaecf5" font-size="12" text-anchor="middle">App Server</text>
      </g>
      <g transform="translate(670, 140)">
        <circle r="22" fill="#2a2e4a"/>
        <text x="0" y="-30" fill="#eaecf5" font-size="12" text-anchor="middle">DB Server</text>
      </g>
      <g transform="translate(770, 330)">
        <circle r="22" fill="#2a2e4a"/>
        <text x="0" y="-30" fill="#eaecf5" font-size="12" text-anchor="middle">Admin Panel</text>
      </g>
      <g transform="translate(940, 240)">
        <circle r="24" fill="#2a2e4a" stroke="#8a90b8" stroke-width="1.5"/>
        <text x="0" y="-32" fill="#eaecf5" font-size="12" font-weight="700" text-anchor="middle">Core</text>
      </g>
    </svg>

    <!-- Single Top-Right Node Inspector (Notice: NO second duplicate Hacker box underneath!) -->
    <aside class="node-inspector" aria-label="Inspector de nodo">
      <div class="insp-title" id="insp-title">WebServer</div>
      <div class="insp-row"><span class="stat-label">Coste de enlace</span><span class="stat-val">1.0</span></div>
      <div class="insp-row"><span class="stat-label">Alerta IDS</span><span style="color:var(--warning);font-weight:700;">10%</span></div>
      <div class="insp-desc">Servidor web público en DMZ.</div>
    </aside>
  </main>

  <!-- 3. SINGLE UNIFIED BOTTOM DOCK (All interactive tools in ONE place, dynamic spacing, zero duplicate text) -->
  <footer class="bottom-dock">
    <div class="dock-left" id="dock-left">
      <!-- Contextual status or mode hint -->
    </div>

    <div class="dock-center" id="dock-actions">
      <!-- Populated per mode -->
    </div>

    <div class="dock-right">
      <button class="cam-btn" title="Terminal Táctica">[~] CLI</button>
      <button class="cam-btn" title="Centrar Cámara">[⟲]</button>
      <button class="cam-btn" title="Alejar">[-]</button>
      <button class="cam-btn" title="Acercar">[+]</button>
      <button class="cam-btn" style="border-color:var(--warning);color:var(--warning);" title="Pausa">[⏸]</button>
    </div>
  </footer>

<script>
  const modes = {
    heist: {
      badge: "HEIST // VEX",
      color: "#bf5af2",
      bg: "#120918",
      title: "La Ruta del Oro",
      pos: "POS: Inicio",
      target: "META: Lobby",
      telemetry: `
        <div class="stat-chip"><span class="stat-label">TURNO</span><span class="stat-val">0</span></div>
        <div class="stat-chip"><span class="stat-label">COSTE ACUM.</span><span class="stat-val">0.0</span></div>
        <div class="stat-chip">
          <span class="stat-label">PRESUPUESTO</span>
          <div class="meter-track"><div class="meter-fill" style="width:86%;background:#39ff88;"></div></div>
          <span class="stat-val" style="color:#39ff88;">24 / 28</span>
        </div>
        <div class="stat-chip"><span class="stat-label">WAYPOINTS</span><span class="stat-val">1 / 3</span></div>
      `,
      dockLeft: `<span style="font-size:12px;color:#8a90b8;">DESTINO SELECCIONADO: <strong style="color:#00e5ff;">Perímetro (Coste 1.0)</strong></span>`,
      dockActions: `
        <button class="tactical-btn"><span class="keycap">TAB</span> SIGUIENTE VECINO</button>
        <button class="tactical-btn"><span class="keycap">P</span> RUTA DIJKSTRA</button>
        <button class="tactical-btn primary-cta"><span class="keycap">ENTER / TAP</span> ⏭ MOVER A PERÍMETRO</button>
      `
    },
    hacker: {
      badge: "HACKER // N0X",
      color: "#39ff88",
      bg: "#09120e",
      title: "Lateral Movement",
      pos: "POS: DMZ",
      target: "META: WebServer",
      telemetry: `
        <div class="stat-chip"><span class="stat-label">TURNO</span><span class="stat-val">0</span></div>
        <div class="stat-chip">
          <span class="stat-label">PRESUPUESTO</span>
          <div class="meter-track"><div class="meter-fill" style="width:100%;background:#39ff88;"></div></div>
          <span class="stat-val" style="color:#39ff88;">18 / 18</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">RUIDO IDS</span>
          <div class="meter-track"><div class="meter-fill" style="width:15%;background:#ffc857;"></div></div>
          <span class="stat-val" style="color:#ffc857;">15%</span>
        </div>
        <div class="stat-chip"><span class="stat-label">WAYPOINTS</span><span class="stat-val">1 / 2</span></div>
      `,
      dockLeft: `<button class="tactical-btn active"><span class="keycap">X</span> SCAN RED</button>`,
      dockActions: `
        <button class="tactical-btn"><span class="keycap">1</span> BYPASS ×2</button>
        <button class="tactical-btn"><span class="keycap">2</span> ESCALATE ×1</button>
        <button class="tactical-btn"><span class="keycap">3</span> PERSIST ×1</button>
        <button class="tactical-btn disabled"><span class="keycap">4</span> HONEYPOT ×0</button>
        <button class="tactical-btn primary-cta"><span class="keycap">ENTER</span> ⏭ MOVER A WEBSERVER</button>
      `
    },
    cyber: {
      badge: "BLUE TEAM // AEGIS",
      color: "#00d2ff",
      bg: "#081018",
      title: "Defensa Perimetral",
      pos: "INTRUSO: Internet",
      target: "NÚCLEO: DataCenter",
      telemetry: `
        <div class="stat-chip"><span class="stat-label">TURNO</span><span class="stat-val">0</span></div>
        <div class="stat-chip"><span class="stat-label">BLOQUEOS DISP.</span><span class="stat-val" style="color:#39ff88;">● ● (2)</span></div>
        <div class="stat-chip">
          <span class="stat-label">RASTREO EDR</span>
          <div class="meter-track"><div class="meter-fill" style="width:35%;background:#00d2ff;"></div></div>
          <span class="stat-val" style="color:#00d2ff;">35%</span>
        </div>
      `,
      dockLeft: `<span style="font-size:12px;color:#8a90b8;">HERRAMIENTA ACTIVA: <strong style="color:#00d2ff;">SEGMENTAR ARISTA</strong></span>`,
      dockActions: `
        <button class="tactical-btn active"><span class="keycap">1</span> SEGMENTAR ARISTA</button>
        <button class="tactical-btn"><span class="keycap">2</span> FIREWALL NODO</button>
        <button class="tactical-btn"><span class="keycap">3</span> CUARENTENA HOST</button>
        <button class="tactical-btn"><span class="keycap">4</span> RADAR MIN-CUT</button>
      `
    }
  };

  function setMode(m) {
    const cfg = modes[m];
    document.querySelectorAll('.preview-switcher button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + m).classList.add('active');
    const badge = document.getElementById('mode-badge');
    badge.textContent = cfg.badge;
    badge.style.color = cfg.color;
    document.getElementById('level-title').textContent = cfg.title;
    document.getElementById('pos-label').textContent = cfg.pos;
    document.getElementById('target-pill').textContent = cfg.target;
    document.getElementById('top-telemetry').innerHTML = cfg.telemetry;
    document.getElementById('dock-left').innerHTML = cfg.dockLeft;
    document.getElementById('dock-actions').innerHTML = cfg.dockActions;
    document.getElementById('canvas-area').style.backgroundColor = cfg.bg;
  }
  setMode('hacker');
</script>
</body>
</html>
