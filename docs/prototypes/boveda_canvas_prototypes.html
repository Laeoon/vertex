    border-radius: 5px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;

  button.nav-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  button.nav-btn.active {
    color: #05070c;
    background: var(--accent);
    border-color: var(--accent);

    background: var(--pink);
    border-color: var(--pink);
    font-weight: 700;
  }

    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 10px;

  // RobCo Memory Builder (uniform phosphor camouflage)
  function buildRobCoMemory(fileIdx, removedDuds) {
    const targetPass = ENC_FILES[fileIdx].pass;
    let seed = 1337 + fileIdx * 97;
    const rand = () => {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed;
    };
    const cols = [[], []];
    const rowWords = {
      0: { 1: targetPass, 4: 'HYPERVIS', 7: 'BACKBONE', 10: 'PROTOCOL', 13: 'SENTINEL', 15: 'MAINFRAM' },
      1: { 2: 'SHAMIRKY', 5: 'ZEROTRST', 8: 'SYNDICAT', 11: 'TOPOLOGY', 14: 'DEADLOCK' }
    };
    if (fileIdx % 2 === 1) {
      delete rowWords[0][1];
      rowWords[1][3] = targetPass;
    }
    const rowTraps = {
      0: { 2: TERMLINK_TRAPS[0], 6: TERMLINK_TRAPS[1], 12: TERMLINK_TRAPS[2] },
      1: { 0: TERMLINK_TRAPS[3], 6: TERMLINK_TRAPS[4], 12: TERMLINK_TRAPS[5] }
    };
    for (let c = 0; c < 2; c++) {
      const baseAddr = c === 0 ? 0x7f40 : 0x8740;
      for (let r = 0; r < 16; r++) {
        const addr = '0x' + (baseAddr + r * 8).toString(16).toUpperCase();
        const chars = [];
        for (let i = 0; i < 16; i++) chars.push(NOISE_CHARS[rand() % NOISE_CHARS.length]);
        const tokens = [];
        const w = rowWords[c][r];
        if (w) {
          const start = rand() % 7;
          const dead = removedDuds.has(w);
          for (let k = 0; k < w.length; k++) chars[start + k] = dead ? '.' : w[k];
          if (!dead) tokens.push({ start, end: start + w.length - 1, text: w, type: 'word' });
        } else if (rowTraps[c][r]) {
          const tr = rowTraps[c][r];
          const start = rand() % (16 - tr.length);
          const dead = removedDuds.has(`${c}:${r}`);
          for (let k = 0; k < tr.length; k++) chars[start + k] = dead ? '.' : tr[k];
          if (!dead) tokens.push({ start, end: start + tr.length - 1, text: tr, type: 'trap', key: `${c}:${r}` });
        }
        cols[c].push({ addr, chars, tokens });
      }
    }
    return cols;
  }

  function drawHolo3D(cx, cy, radius, color, seed = 0, unlocked = true) {
    const t = state.time * 1.15 + seed;
    const cosY = Math.cos(t), sinY = Math.sin(t);
    const cosX = Math.cos(t * 0.55), sinX = Math.sin(t * 0.55);

    const pts3 = [
      [0, -1.15, 0], [0.95, 0, 0], [0, 0, 0.95],
      [-0.95, 0, 0], [0, 0, -0.95], [0, 1.15, 0]
    ];
    const edges = [
      [0, 1], [0, 2], [0, 3], [0, 4],
      [5, 1], [5, 2], [5, 3], [5, 4],
      [1, 2], [2, 3], [3, 4], [4, 1]
    ];
    const proj = pts3.map(([vx, vy, vz]) => {
      const rx = vx * cosY - vz * sinY;
      const rz = vx * sinY + vz * cosY;
      const ry = vy * cosX - rz * sinX;
      const fz = vy * sinX + rz * cosX;
      const scale = radius / (2.6 - fz * 0.55);
      return [cx + rx * scale, cy + ry * scale];
    });

    const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius * 1.15);
    grad.addColorStop(0, unlocked ? `${color}38` : '#3b475e25');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, radius * 1.15, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.35);
    ctx.strokeStyle = unlocked ? `${color}55` : '#3d485e66';
    ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.ellipse(0, 0, radius * 0.92, radius * 0.32, 0.3, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = unlocked ? color : PAL.dim;
    ctx.lineWidth = unlocked ? 1.8 : 1.1;
    ctx.beginPath();
    for (const [a, b] of edges) { ctx.moveTo(proj[a][0], proj[a][1]); ctx.lineTo(proj[b][0], proj[b][1]); }
    ctx.stroke();

    if (unlocked) {
      for (let i = 0; i < 6; i++) {
        const ang = t * 1.6 + i * (Math.PI / 3);
        const px = cx + Math.cos(ang) * radius * 0.85;
        const py = cy + Math.sin(ang * 1.3) * radius * 0.42;
        ctx.fillStyle = i % 2 === 0 ? color : '#ffffff';
        ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawLeftDrum() {
    const x0 = 16, y0 = 16, w = 292, h = H - 32;
    drawPanel(x0, y0, w, h, 'LA BÓVEDA // DRUM-2.5D', PAL.accent, '#080c14');

    });

    const slotLabel = `SLOT 0${state.slotIndex + 1}`;
    drawPill(x0 + 116, y0 + 20, 82, 26, slotLabel, true, PAL.green);
    regHit('slot', x0 + 116, y0 + 20, 82, 26, () => { state.slotIndex = (state.slotIndex + 1) % 3; });

    ctx.font = '700 10px "JetBrains Mono", monospace';
    ctx.fillStyle = PAL.dim;
    ctx.fillText('60 FPS', x0 + 216, y0 + 37);

    const drumCx = x0 + w / 2, drumCy = y0 + 345, radiusY = 175;
    const spinSpeed = Math.abs(state.drumVel) + Math.abs(state.drumTarget - state.drumAngle);

    // Graduated rotor arc
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x0 + 24, drumCy, 220, -0.75, 0.75); ctx.stroke();
    for (let deg = -50; deg <= 50; deg += 25) {
      const ang = (deg * Math.PI) / 180;
      const tickX = x0 + 24 + Math.cos(ang) * 220, tickY = drumCy + Math.sin(ang) * 220;
      ctx.fillStyle = deg === 0 ? MODES[state.activeMode].color : PAL.muted;
      ctx.fillRect(tickX - 4, tickY - 1, 8, 2);
      ctx.font = '700 8px "JetBrains Mono", monospace';
      ctx.fillText(deg === 0 ? 'LOCK' : `${deg > 0 ? '+' : ''}${deg}°`, x0 + 10, tickY + 3);
    }
    ctx.restore();

    const items = MODES.map((m, idx) => {
      let delta = idx - state.drumAngle;
      while (delta > 2.5) delta -= 5;
      while (delta < -2.5) delta += 5;
      const theta = delta * 0.58;
      return { m, idx, delta, zDepth: Math.cos(theta), yPos: drumCy + Math.sin(theta) * radiusY };
    }).sort((a, b) => a.zDepth - b.zDepth);

    for (const it of items) {
      const scale = 0.72 + 0.28 * Math.max(0, it.zDepth);
      const cardW = (w - 38) * scale, cardH = 68 * scale;
      const cx = drumCx - cardW / 2 + (1 - scale) * 16, cy = it.yPos - cardH / 2;
      const isSelected = it.idx === state.activeMode && Math.abs(it.delta) < 0.35;
      const alpha = Math.max(0.25, Math.min(1, 0.28 + it.zDepth * 0.75));

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = isSelected ? '#101b2d' : '#0b111c';
      ctx.strokeStyle = isSelected ? it.m.color : PAL.borderHi;
      ctx.lineWidth = isSelected ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 6); ctx.fill(); ctx.stroke();

      if (isSelected) {
        ctx.fillStyle = it.m.color;
        ctx.fillRect(cx, cy + 8, 4, cardH - 16);
        if (state.drumLockFlash > 0.02) {
          const sweepX = cx + (1 - state.drumLockFlash) * cardW;
          ctx.fillStyle = `rgba(255, 255, 255, ${state.drumLockFlash * 0.45})`;
          ctx.fillRect(cx, cy, cardW, 2);
          ctx.fillRect(sweepX - 6, cy + 4, 12, cardH - 8);
        }
        if (it.idx === 3) {
          for (let b = 0; b < 5; b++) {
            const bh = 4 + state.fftBands[b * 4] * 18;
            ctx.fillStyle = PAL.pink;
            ctx.fillRect(cx + cardW - 36 + b * 5, cy + cardH - 14 - bh, 3, bh);
          }
        }
      }

      ctx.font = `700 ${Math.round(13 * scale)}px "JetBrains Mono", monospace`;
      ctx.fillStyle = isSelected ? it.m.color : PAL.text;
      ctx.fillText(`${it.m.code} // ${it.m.name}`, cx + 14 * scale, cy + 27 * scale);

      ctx.font = `400 ${Math.round(10 * scale)}px "JetBrains Mono", monospace`;
      ctx.fillStyle = PAL.dim;
      ctx.fillText(it.m.sub, cx + 14 * scale, cy + 46 * scale);
      ctx.restore();

      regHit(`drum_${it.idx}`, cx, cy, cardW, cardH, () => setActiveMode(it.idx));
    }

    // Lock-On Jaws
    const jawSpread = Math.min(18, spinSpeed * 22);
    ctx.strokeStyle = MODES[state.activeMode].color;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(x0 + 18, drumCy - 26 - jawSpread); ctx.lineTo(x0 + 10, drumCy - 26 - jawSpread);
    ctx.lineTo(x0 + 10, drumCy + 26 + jawSpread); ctx.lineTo(x0 + 18, drumCy + 26 + jawSpread);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0 + w - 18, drumCy - 26 - jawSpread); ctx.lineTo(x0 + w - 10, drumCy - 26 - jawSpread);
    ctx.lineTo(x0 + w - 10, drumCy + 26 + jawSpread); ctx.lineTo(x0 + w - 18, drumCy + 26 + jawSpread);
    ctx.stroke();

    const fy = y0 + h - 82;
    ctx.font = '400 10px "JetBrains Mono", monospace';
    ctx.fillStyle = PAL.dim;
    ctx.fillText('RUEDA / ↑ ↓ / CLIC PARA GIRAR', x0 + 22, fy + 26);
    ctx.fillStyle = MODES[state.activeMode].color;
    ctx.fillText(`MODO: ${MODES[state.activeMode].code} // ${MODES[state.activeMode].name}`, x0 + 22, fy + 46);
  }

  function setActiveMode(idx) {
    const next = ((idx % 5) + 5) % 5;
    if (next !== state.activeMode) {
      state.activeMode = next;

  function drawTreeNodeShape(cx, cy, r, node, treeId, isSel) {
    const isMythic = node.rarity === 'MÍTICA // Ω';
    const baseCol = RARITY_COLORS[node.rarity];
    const col = isSel ? '#ffffff' : (node.unlocked ? baseCol : PAL.muted);

    if (isMythic) {
      const pulse = 3 + Math.sin(state.time * 3.5) * 2;
      ctx.strokeStyle = `${PAL.pink}88`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx, cy, r + pulse + 3, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = node.unlocked ? '#0e192b' : '#080c14';
    ctx.strokeStyle = col;
    ctx.lineWidth = isSel ? 2.6 : (node.unlocked ? 1.8 : 1.1);
    ctx.beginPath();
    if (treeId === 'GENERAL') {
      ctx.moveTo(cx, cy - r * 1.15); ctx.lineTo(cx + r * 1.15, cy);
      ctx.lineTo(cx, cy + r * 1.15); ctx.lineTo(cx - r * 1.15, cy); ctx.closePath();
    } else if (treeId === 'CYBER') {
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 6;
        const px = cx + r * 1.05 * Math.cos(a), py = cy + r * 1.05 * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else if (treeId === 'UNIX' || treeId === 'HEIST') {
      ctx.roundRect(cx - r * 0.95, cy - r * 0.95, r * 1.9, r * 1.9, 4);
    } else {
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
    ctx.fill(); ctx.stroke();

    ctx.font = `700 ${isMythic ? 12 : 10}px "JetBrains Mono", monospace`;
    ctx.fillStyle = node.unlocked ? baseCol : PAL.dim;
    ctx.textAlign = 'center'; ctx.fillText(node.glyph, cx, cy + 4); ctx.textAlign = 'left';
  }

  function drawSkillTreeGraph(gx, gy, gw, gh, tree) {
    const ease = Math.min(1, state.treeTransition);
    const cx = gx + gw / 2, cy = gy + gh / 2;

    ctx.save();
    if (tree.id === 'GENERAL') {
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.16)';
      [68, 138, 195].forEach((rad) => { ctx.beginPath(); ctx.arc(cx, cy, rad * ease, 0, Math.PI * 2); ctx.stroke(); });
    } else if (tree.id === 'HEIST') {
      ctx.strokeStyle = 'rgba(57, 255, 136, 0.12)'; ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(gx + 16, gy + gh * 0.28); ctx.lineTo(gx + gw - 16, gy + gh * 0.28);
      ctx.moveTo(gx + 16, gy + gh * 0.72); ctx.lineTo(gx + gw - 16, gy + gh * 0.72);
      ctx.stroke(); ctx.setLineDash([]);
    } else if (tree.id === 'HACKER') {
      ctx.strokeStyle = 'rgba(255, 200, 87, 0.12)';
      [0.36, 0.60, 0.84].forEach((yPct) => {
        ctx.beginPath(); ctx.moveTo(gx + 16, gy + gh * yPct); ctx.lineTo(gx + gw - 16, gy + gh * yPct); ctx.stroke();
      });
    } else if (tree.id === 'UNIX') {
      ctx.strokeStyle = 'rgba(255, 46, 136, 0.08)';
      for (let x = gx; x <= gx + gw; x += 36) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh); ctx.stroke(); }
    }
    ctx.restore();

    const pxPts = tree.nodes.map((n) => ({
      x: cx + (gx + n.pos[0] * gw - cx) * ease,
      y: cy + (gy + n.pos[1] * gh - cy) * ease
    }));

    tree.edges.forEach(([a, b], eIdx) => {
      const pa = pxPts[a], pb = pxPts[b], na = tree.nodes[a], nb = tree.nodes[b];
      const active = na.unlocked && nb.unlocked;
      ctx.strokeStyle = active ? `${tree.color}aa` : '#1c283b';
      ctx.lineWidth = active ? 2.1 : 1.1;
      ctx.beginPath();
      if (tree.id === 'UNIX') {
        const midX = (pa.x + pb.x) / 2;
        ctx.moveTo(pa.x, pa.y); ctx.lineTo(midX, pa.y); ctx.lineTo(midX, pb.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.fillStyle = active ? tree.color : '#28364d';
        ctx.beginPath(); ctx.arc(midX, pa.y, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(midX, pb.y, 2.2, 0, Math.PI * 2); ctx.fill();
      } else if (tree.id === 'HEIST') {
        const cpx = (pa.x + pb.x) / 2;
        ctx.moveTo(pa.x, pa.y); ctx.bezierCurveTo(cpx, pa.y, cpx, pb.y, pb.x, pb.y); ctx.stroke();
      } else if (tree.id === 'HACKER') {
        const midY = (pa.y + pb.y) / 2;
        ctx.moveTo(pa.x, pa.y); ctx.lineTo(pa.x, midY); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      } else {
        ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
      if (active) {
        const t = (state.time * 0.75 + eIdx * 0.22) % 1;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(pa.x + (pb.x - pa.x) * t, pa.y + (pb.y - pa.y) * t, 2.3, 0, Math.PI * 2); ctx.fill();
      }
    });

    state.hoverNodeIdx = -1;
    pxPts.forEach((pt, idx) => {
      const node = tree.nodes[idx], isSel = state.selectedNodeIdx === idx;
      const r = isSel ? 14 : (node.rarity === 'MÍTICA // Ω' ? 12 : 10);
      if (Math.hypot(state.mouseX - pt.x, state.mouseY - pt.y) <= r + 6) state.hoverNodeIdx = idx;
      drawTreeNodeShape(pt.x, pt.y, r, node, tree.id, isSel);
      if (state.equippedBadgeTitle === node.title) {
        ctx.font = '700 10px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.amber;
        ctx.textAlign = 'center'; ctx.fillText('★', pt.x, pt.y - r - 4); ctx.textAlign = 'left';
      }
      regHit(`tnode_${idx}`, pt.x - 16, pt.y - 16, 32, 32, () => { state.selectedNodeIdx = idx; });
    });

    if (state.hoverNodeIdx >= 0) {
      const hn = tree.nodes[state.hoverNodeIdx], hp = pxPts[state.hoverNodeIdx];
      const label = `${hn.glyph} ${hn.title}`;
      ctx.font = '700 10px "JetBrains Mono", monospace';
      const tw = ctx.measureText(label).width + 16;
      const tx = Math.min(gx + gw - tw - 4, Math.max(gx + 4, hp.x - tw / 2));
      const ty = Math.max(gy + 4, hp.y - 36);
      ctx.fillStyle = '#09111d'; ctx.strokeStyle = RARITY_COLORS[hn.rarity];
      ctx.beginPath(); ctx.roundRect(tx, ty, tw, 22, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = PAL.text; ctx.fillText(label, tx + 8, ty + 14);
    }
  }

        ctx.font = '400 12px "JetBrains Mono", monospace';
        ctx.fillStyle = '#2d7a56';
        ctx.fillText(row.addr, colX, y);

        const dataX = colX + 54;
        // Check if mouse hovers any token OR single noise char
        let hovTok = null;
        let hovSingleIdx = -1;
        for (const tok of row.tokens) {
          const tx0 = dataX + tok.start * charW, tx1 = dataX + (tok.end + 1) * charW;
          if (state.mouseX >= tx0 && state.mouseX <= tx1 && state.mouseY >= y - 13 && state.mouseY <= y + 5) {
            hovTok = tok;
            state.termlinkHoverChar = tok.text;
            regHit(`tl_tok_${c}_${r}`, tx0, y - 13, tx1 - tx0, 18, () => {
              if (tok.type === 'word') guessTermlinkWord(tok.text, curFile);
              else triggerTermlinkTrap(tok);
            });
          }
        }
        if (!hovTok && state.mouseY >= y - 13 && state.mouseY <= y + 5) {
          const ci = Math.floor((state.mouseX - dataX) / charW);
          if (ci >= 0 && ci < 16) {
            hovSingleIdx = ci;
            state.termlinkHoverChar = row.chars[ci];
          }
        }

        // Draw all 16 chars in identical weight & color unless hovered!
        ctx.font = '400 12px "JetBrains Mono", monospace';
        for (let i = 0; i < 16; i++) {
          const cx = dataX + i * charW;
          const inTok = hovTok && i >= hovTok.start && i <= hovTok.end;
          const inSingle = !hovTok && hovSingleIdx === i;
          if (inTok || inSingle) {
            ctx.fillStyle = PAL.green;
            ctx.fillRect(cx - 0.5, y - 13, charW + 0.5, 17);
            ctx.fillStyle = '#05070c';
          } else {
            ctx.fillStyle = PAL.phosphor;
          }
          ctx.fillText(row.chars[i], cx, y);
        }
      });
    }

    const cx = hx + 468, cw = hw - 484;
    drawTuiBox(cx, ry + 78, cw, rh - 96, ' CONSOLA ', PAL.green, true);
    ctx.font = '400 11px "JetBrains Mono", monospace';
    state.termlinkLogs.slice(-13).forEach((ln, idx) => {
      ctx.fillStyle = ln.includes('GRANTED') ? PAL.green : ln.includes('LIKENESS') ? PAL.amber : '#66cdaa';
      ctx.fillText(ln.slice(0, 24), cx + 10, ry + 106 + idx * 22);
    });

    if (state.termlinkLastLikeness) {
      const lm = state.termlinkLastLikeness, my2 = ry + rh - 144;
      ctx.font = '700 10px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.amber;
      ctx.fillText(`POSICIÓN: ${lm.word} (${lm.score}/8)`, cx + 10, my2);
      for (let i = 0; i < 8; i++) {
        const bx = cx + 10 + i * 20;

        ctx.strokeStyle = PAL.green;
        ctx.fillRect(bx, my2 + 8, 17, 20); ctx.strokeRect(bx, my2 + 8, 17, 20);
        ctx.fillStyle = lm.mask[i] ? '#05070c' : '#3a6e54';
        ctx.fillText(lm.mask[i] ? lm.word[i] : '·', bx + 5, my2 + 22);
      }
    }

    const blink = Math.floor(state.time * 2.5) % 2 === 0 ? '█' : '';
    ctx.font = '700 13px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.green;
    ctx.fillText(`>${state.termlinkHoverChar}${blink}`, cx + 10, ry + rh - 34);

  function resetTermlink() {
    state.termlinkAttempts = 4;
    state.termlinkRemovedDuds.clear();
    state.termlinkLastLikeness = null;
    state.termlinkLogs = [`> MOUNTED ${ENC_FILES[state.termlinkFileIdx].file}`, '> ESCANEA LA MEMORIA CON EL CURSOR'];
  }

  function guessTermlinkWord(word, curFile) {
    if (state.termlinkAttempts <= 0 || curFile.unlocked) return;
    if (word === curFile.pass) {
      curFile.unlocked = true;
      state.termlinkView = 'DOSSIER';
      state.termlinkLogs.push(`> ${word}`, '> ACCESS GRANTED!');
      state.termlinkLastLikeness = { word, score: 8, mask: Array(8).fill(true) };
      return;
    }
    const mask = [];
    let score = 0;
    for (let i = 0; i < 8; i++) { const ok = word[i] === curFile.pass[i]; mask.push(ok); if (ok) score++; }
    state.termlinkLastLikeness = { word, score, mask };
    state.termlinkAttempts = Math.max(0, state.termlinkAttempts - 1);
    state.termlinkLogs.push(`> ${word}`, '> ENTRY DENIED', `> LIKENESS=${score}/8`);
    if (state.termlinkAttempts === 0) state.termlinkLogs.push('> LOCKOUT! REINICIA MEMORIA.');
  }

  function triggerTermlinkTrap(tok) {
    state.termlinkRemovedDuds.add(tok.key);
    const curFile = ENC_FILES[state.termlinkFileIdx];
    const dud = TERMLINK_WORDS.find((w) => w !== curFile.pass && !state.termlinkRemovedDuds.has(w));
    if (dud && Math.random() > 0.3) {
      state.termlinkRemovedDuds.add(dud);
      state.termlinkLogs.push(`> ${tok.text}`, `> DUD REMOVED: ${dud}`);
    } else {
      state.termlinkAttempts = 4;
      state.termlinkLogs.push(`> ${tok.text}`, '> ALLOWANCE REPLENISHED');
    }
  }

  function runShellCmd(raw) {
    const cmd = raw.trim();
    if (!cmd) return;
    const opUser = state.cliContext === 'VEX' ? 'vex' : state.alias.toLowerCase();
    const opHost = state.cliContext === 'VEX' ? 'sector0-node' : 'boveda-lab';
    state.terminalLines.push({ text: `${opUser}@${opHost}:${state.cwd}$ ${cmd}`, col: PAL.green });

    if (cmd === 'academy') {
      launchAcademy();
      return;
    } else if (cmd === 'clear') {
      state.terminalLines = [];
    } else if (cmd === 'pwd') {
      state.terminalLines.push({ text: state.cwd, col: PAL.text });
    } else if (cmd === 'ls' || cmd === 'ls -l') {
      state.terminalLines.push({ text: 'descargas/   documentos/   fotos/   notas.txt   /usr/games/breach3d*', col: PAL.accent });

    } else if (cmd.startsWith('cat')) {
      state.terminalLines.push({ text: 'notas.txt -> "Clave wifi de casa: vertex-2026 | Receta en documentos/"', col: PAL.text });
    } else if (cmd.startsWith('cd ')) {
      state.cwd = cmd.slice(3).trim() || '/home/usuario';
      state.terminalLines.push({ text: `-> cwd = ${state.cwd}`, col: PAL.dim });

      launchDive3D();
    } else {
      state.terminalLines.push({ text: `vtx-sh: '${cmd}' ejecutado.`, col: PAL.dim });
    }
    while (state.terminalLines.length > 26) state.terminalLines.shift();
  }

    } else if (cmd.includes('receta.txt')) {
      state.academyFlashPath = 'receta.txt';
      state.academyLines.push({ text: 'receta.txt -> "Café fuerte + 2 líneas de Bash al día."', col: PAL.text });
    } else if (cmd.includes('wifi')) {
      state.academyFlashPath = 'notas.txt';
      state.academyLines.push({ text: 'notas.txt:3 -> "Clave wifi de casa: vertex-2026"', col: PAL.text });
    } else if (cmd === 'pwd') {
      state.academyLines.push({ text: state.academyCwd, col: PAL.text });
    } else if (cmd === 'clear') {
      state.academyLines = [];
      return;
    }

    const mod = ACADEMY_MODULES[state.academyModIdx];
    const targetObj = mod.isBoss ? mod.chain[state.bossStepIdx] : mod.phases[state.academyPhase === 'PRACTICA' ? 'PRACTICA' : 'GUIADO'];
    const isOptimal = cmd === targetObj.cleverCmd;
    const isNormal = cmd === targetObj.normalCmd;

    if (isOptimal || isNormal) {
      const pts = (isOptimal ? 250 : 100) * state.academyStreak;
      state.academyScore += pts;
      if (isOptimal) state.academyStreak = Math.min(4, state.academyStreak + 1);
      state.academyAnalysis = { cmd, optimal: targetObj.cleverCmd, isOptimal, pts, breakdown: targetObj.breakdown };
      if (mod.isBoss) {
        if (state.bossStepIdx < mod.chain.length - 1) state.bossStepIdx++;
        else { state.bossStepIdx = 0; state.academyLines.push({ text: '🏆 PRUEBA DE CAMPO COMPLETADA.', col: PAL.green }); }
      }
    } else if (mod.isBoss) {
      state.academyShields = Math.max(0, state.academyShields - 1);
      state.academyStreak = 1;
      if (state.academyShields === 0) {
        state.academyShields = 3;
        state.bossStepIdx = 0;
        state.academyLines.push({ text: '⚠ ESCUDOS AGOTADOS — REINICIANDO SECUENCIA.', col: PAL.pink });
      }
    }
    while (state.academyLines.length > 26) state.academyLines.shift();
  }

  // ─── MODE 4: MUSICBOX FFT ───
  function drawMode4MusicBox(rx, ry, rw, rh) {
    const topH = 286, tr = TRACKS[state.playingTrack];
    drawPanel(rx, ry, rw, topH, `ncmpcpp::spectrum-fft [${String(tr.id).padStart(2, '0')}/22 ${tr.title}]`, PAL.pink);

    const fx = rx + 24, fy = ry + 36, fw = rw - 48, fh = 162, bw = fw / 32;
    for (let i = 0; i < 32; i++) {
      const val = state.fftBands[i], bh = val * fh, x = fx + i * bw + 3, barW = bw - 6;
      const grad = ctx.createLinearGradient(0, fy + fh - bh, 0, fy + fh);
      grad.addColorStop(0, PAL.pink); grad.addColorStop(0.55, PAL.purple); grad.addColorStop(1, PAL.accent);
      ctx.fillStyle = grad; ctx.fillRect(x, fy + fh - bh, barW, bh);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, fy + fh - state.fftPeaks[i] * fh - 3, barW, 3);
    }

    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i <= 90; i++) {
      const t = i / 90, wx = fx + t * fw, amp = state.musicPlaying ? (12 + 10 * tr.energy) : 2;
      const wy = ry + 232 + Math.sin(t * 24 + state.time * 7) * amp * Math.sin(t * Math.PI);
      if (i === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();

    const cy = ry + topH - 38;
    drawPill(rx + 24, cy, 130, 26, state.musicPlaying ? '❚❚ PAUSAR' : '▶ REPRODUCIR', state.musicPlaying, PAL.pink);
    regHit('musicPlay', rx + 24, cy, 130, 26, () => { state.musicPlaying = !state.musicPlaying; });
    drawPill(rx + 170, cy, 175, 26, state.pinMenu ? '★ FIJADO EN MENÚ' : 'FIJAR EN MENÚ', state.pinMenu, PAL.accent);
    regHit('pinMenu', rx + 170, cy, 175, 26, () => { state.pinMenu = !state.pinMenu; });
    drawPill(rx + 360, cy, 175, 26, state.pinGame ? '★ FIJADO EN JUEGO' : 'FIJAR EN JUEGO', state.pinGame, PAL.green);
    regHit('pinGame', rx + 360, cy, 175, 26, () => { state.pinGame = !state.pinGame; });

    ctx.font = '700 11px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.dim; ctx.textAlign = 'right';
    ctx.fillText(`PACK: ${tr.pack}  |  BPM: ${tr.bpm}  |  DUR: ${tr.dur}`, rx + rw - 24, cy + 17);
    ctx.textAlign = 'left';

    const botY = ry + topH + 14, botH = rh - topH - 14;
    drawPanel(rx, botY, rw, botH, 'PLAYLIST // 22 TRACKS (DavidKBD)', PAL.purple);
    const colW = (rw - 48) / 2;
    TRACKS.forEach((t, idx) => {
      const col = idx < 11 ? 0 : 1, row = idx % 11;
      const tx = rx + 18 + col * (colW + 12), ty = botY + 22 + row * 29;
      const active = state.playingTrack === idx;
      ctx.fillStyle = active ? '#1b132b' : 'transparent';
      ctx.beginPath(); ctx.roundRect(tx, ty, colW, 24, 3); ctx.fill();
      ctx.font = active ? '700 11px "JetBrains Mono", monospace' : '400 11px "JetBrains Mono", monospace';
      ctx.fillStyle = active ? PAL.pink : PAL.text;
      ctx.fillText(`${String(t.id).padStart(2, '0')}. ${t.title}`, tx + 10, ty + 16);
      ctx.fillStyle = PAL.dim; ctx.textAlign = 'right'; ctx.fillText(t.dur, tx + colW - 10, ty + 16); ctx.textAlign = 'left';
      regHit(`track_${idx}`, tx, ty, colW, 24, () => { state.playingTrack = idx; state.musicPlaying = true; });
    });
  }

  // ─── MODE 5: ARCADE & DIVE-IN 3D ───
  function drawMode5Arcade(rx, ry, rw, rh) {
    drawPanel(rx, ry, rw, rh, 'ARCADE // /usr/games/ — CARTUCHOS HOLOGRÁFICOS', PAL.purple);
    ctx.font = '400 12px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.dim;
    ctx.fillText('Selecciona un cartucho y pulsa [EJECUTAR DIVE-IN 3D] para entrar al entorno vectorial:', rx + 22, ry + 36);

    const cardW = (rw - 66) / 2, cardH = 216;
    CARTRIDGES.forEach((c, idx) => {
      const col = idx % 2, row = Math.floor(idx / 2);
      const cx = rx + 22 + col * (cardW + 22), cy = ry + 54 + row * (cardH + 18);
      const sel = state.selectedCartridge === idx;
      ctx.fillStyle = sel ? '#121a2b' : '#0b1019';
      ctx.strokeStyle = sel ? c.color : PAL.borderHi;
      ctx.lineWidth = sel ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 7); ctx.fill(); ctx.stroke();

      drawHolo3D(cx + 76, cy + 88, 40, c.color, idx * 1.4, true);
      ctx.font = '700 16px "JetBrains Mono", monospace'; ctx.fillStyle = c.color; ctx.fillText(c.title, cx + 144, cy + 48);
      ctx.font = '700 10px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.dim; ctx.fillText(`${c.sub}  |  ${c.ver}`, cx + 144, cy + 68);
      ctx.font = '400 11px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.text;
      wrapText(c.desc, cx + 144, cy + 98, cardW - 166, 17);

      drawPill(cx + 144, cy + cardH - 44, cardW - 166, 30, '⚡ EJECUTAR DIVE-IN 3D', sel, c.color);
      regHit(`cart_${idx}`, cx, cy, cardW, cardH, () => {
        if (state.selectedCartridge === idx) launchDive3D();
        else state.selectedCartridge = idx;
      });
    });
  }

  function launchDive3D() {
    resetDive3D();
    state.diveActive = true;
    state.academyActive = false;
    syncToolbarButtons();
  }

  function drawDive3DScene() {
    ctx.fillStyle = '#03050a'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2 - state.divePlayerX * 120, cy = H / 2 - 20, maxW = 1120, maxH = 620;
    for (let i = 0; i < 14; i++) {
      const z = ((i / 14) + (state.time * 0.95 * state.diveSpeed)) % 1;
      const scale = Math.pow(z, 1.85), rw = maxW * scale, rh = maxH * scale;
      ctx.strokeStyle = `rgba(0, 229, 255, ${0.15 + Math.min(1, z * 1.4) * 0.65})`;
      ctx.lineWidth = 1 + scale * 1.8;
      ctx.strokeRect(cx - rw / 2, cy - rh / 2, rw, rh);
    }
    ctx.strokeStyle = 'rgba(191, 90, 242, 0.38)'; ctx.lineWidth = 1.2;
    [[cx - maxW / 2, cy - maxH / 2], [cx + maxW / 2, cy - maxH / 2],
     [cx + maxW / 2, cy + maxH / 2], [cx - maxW / 2, cy + maxH / 2]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    });
    state.diveObstacles.forEach((ob) => {
      if (ob.hit) return;
      const s = Math.pow(ob.z, 1.85);
      const ox = cx + ob.x * (maxW * 0.42) * s, oy = cy + 60 * s, ow = ob.w * maxW * s * 0.55, oh = 135 * s;
      ctx.fillStyle = 'rgba(255, 46, 136, 0.22)'; ctx.strokeStyle = PAL.pink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(ox - ow / 2, oy - oh / 2, ow, oh); ctx.fill(); ctx.stroke();
    });
    state.diveLasers.forEach((lz) => {
      const s = Math.pow(lz.z, 1.85);
      const lx = cx + lz.x * (maxW * 0.42) * s, ly = cy + 60 * s;
      ctx.strokeStyle = PAL.green; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 22 * s); ctx.stroke();
    });
    const px = W / 2 + state.divePlayerX * 260, py = H - 86;
    ctx.fillStyle = 'rgba(0, 229, 255, 0.22)'; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(px, py - 24); ctx.lineTo(px + 34, py + 18); ctx.lineTo(px, py + 8); ctx.lineTo(px - 34, py + 18); ctx.closePath(); ctx.fill(); ctx.stroke();

    drawPanel(20, 18, 380, 56, `ARCADE // ${CARTRIDGES[state.selectedCartridge].title}`, PAL.pink, 'rgba(8,12,20,0.85)');
    ctx.font = '700 12px "JetBrains Mono", monospace'; ctx.fillStyle = PAL.text;
    ctx.fillText(`SCORE: ${state.diveScore}   |   MOVER: ← / →   |   DISPARO: ESPACIO`, 36, 52);

    drawPill(W - 210, 24, 190, 32, '[ESC] VOLVER A BÓVEDA', true, PAL.pink);
    regHit('exitDive', W - 210, 24, 190, 32, () => { state.diveActive = false; syncToolbarButtons(); });
  }

  function update(dt) {
    state.time += dt;
    const force = (state.drumTarget - state.drumAngle) * 180;
    state.drumVel = (state.drumVel + force * dt) * Math.exp(-13 * dt);
    state.drumAngle += state.drumVel * dt;
    state.drumLockFlash = Math.max(0, state.drumLockFlash - dt * 2.4);
    state.treeTransition = Math.min(1, state.treeTransition + dt * 5.0);

    const tr = TRACKS[state.playingTrack];
    for (let i = 0; i < 32; i++) {
      const target = state.musicPlaying
        ? Math.max(0.08, Math.min(0.98, 0.32 + tr.energy * 0.45 * Math.abs(Math.sin(state.time * (4 + i * 0.15) + i * 0.55))))
        : 0.05;
      state.fftBands[i] += (target - state.fftBands[i]) * Math.min(1, dt * 14);
      if (state.fftBands[i] > state.fftPeaks[i]) state.fftPeaks[i] = state.fftBands[i];
      else state.fftPeaks[i] = Math.max(state.fftBands[i], state.fftPeaks[i] - dt * 0.35);
    }

    if (state.diveActive) {
      state.diveObstacles.forEach((ob) => {
        ob.z += dt * 0.55 * state.diveSpeed;
        if (ob.z > 1.05) { ob.z = 0.12; ob.x = Math.sin(state.time * 3.7 + ob.w * 10) * 0.72; ob.hit = false; state.diveScore += 25; }
      });
      state.diveLasers.forEach((lz) => {
        lz.z -= dt * 1.4;
        state.diveObstacles.forEach((ob) => {
          if (!ob.hit && Math.abs(lz.z - ob.z) < 0.08 && Math.abs(lz.x - ob.x) < 0.18) { ob.hit = true; state.diveScore += 100; }
        });
      });
      state.diveLasers = state.diveLasers.filter((lz) => lz.z > 0.05);
    }
  }

  function render(now) {
    const dt = Math.min(0.05, (now - state.lastTs) / 1000);
    state.lastTs = now;
    update(dt);

    state.hitboxes = [];
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, W, H);

    if (state.diveActive) drawDive3DScene();
    else if (state.academyActive) drawAcademyFullScreen();
    else { drawLeftDrum(); drawRightWorkstation(); }

    let hoverCur = 'default';
    for (let i = state.hitboxes.length - 1; i >= 0; i--) {
      if (pointInRect(state.mouseX, state.mouseY, state.hitboxes[i])) {
        hoverCur = state.hitboxes[i].cursor || 'pointer';
        break;
      }
    }
    canvas.style.cursor = hoverCur;
    requestAnimationFrame(render);
  }

  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * W, y: ((e.clientY - rect.top) / rect.height) * H };
  }

  canvas.addEventListener('mousemove', (e) => {
    const p = canvasCoords(e); state.mouseX = p.x; state.mouseY = p.y;
  });

  canvas.addEventListener('mousedown', (e) => {
    const p = canvasCoords(e); state.mouseX = p.x; state.mouseY = p.y;
    for (let i = state.hitboxes.length - 1; i >= 0; i--) {
      if (pointInRect(p.x, p.y, state.hitboxes[i])) { state.hitboxes[i].onClick(); break; }
    }
  });

  canvas.addEventListener('wheel', (e) => {
    if (state.diveActive || state.academyActive) return;
    const p = canvasCoords(e);
    if (p.x <= 315) { e.preventDefault(); setActiveMode(state.activeMode + (e.deltaY > 0 ? 1 : -1)); }
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (state.diveActive) {
      if (e.key === 'Escape') { state.diveActive = false; syncToolbarButtons(); }
      else if (e.key === 'ArrowLeft' || e.key === 'a') state.divePlayerX = Math.max(-0.85, state.divePlayerX - 0.14);
      else if (e.key === 'ArrowRight' || e.key === 'd') state.divePlayerX = Math.min(0.85, state.divePlayerX + 0.14);
      else if (e.key === ' ') { e.preventDefault(); state.diveLasers.push({ x: state.divePlayerX, z: 0.92 }); }
      return;
    }

    if (state.academyActive) {
      if (e.key === 'Escape') { state.academyActive = false; syncToolbarButtons(); }
      else if (e.key === 'Enter') { runAcademyCmd(state.academyInput); state.academyInput = ''; }
      else if (e.key === 'Backspace') state.academyInput = state.academyInput.slice(0, -1);
      else if (e.key === 'Tab') {
        e.preventDefault();
        const cmds = ['ls -a descargas', 'cat documentos/receta.txt', 'mkdir musica videos', 'grep wifi notas.txt', 'cd ~', 'pwd', 'rm basura.tmp', 'clear'];
        const match = cmds.find((c) => c.startsWith(state.academyInput));
        if (match) state.academyInput = match;
      } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) state.academyInput += e.key;
      return;
    }

    if (state.editingAlias) {
      if (e.key === 'Enter' || e.key === 'Escape') state.editingAlias = false;
      else if (e.key === 'Backspace') state.alias = state.alias.slice(0, -1);
      else if (e.key.length === 1 && state.alias.length < 12 && /[a-zA-Z0-9_-]/.test(e.key)) state.alias += e.key.toUpperCase();
      return;
    }

    if (state.activeMode === 2 && state.terminalFocused) {
      if (e.key === 'Enter') { runShellCmd(state.cmdInput); state.cmdInput = ''; }
      else if (e.key === 'Backspace') state.cmdInput = state.cmdInput.slice(0, -1);
      else if (e.key === 'Tab') {
        e.preventDefault();
        const cmds = ['academy', 'fastfetch', 'pwd', 'ls', 'cat notas.txt', 'breach3d', 'clear'];
        const match = cmds.find((c) => c.startsWith(state.cmdInput));
        if (match) state.cmdInput = match;
      } else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveMode(state.activeMode - 1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); setActiveMode(state.activeMode + 1); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) state.cmdInput += e.key;
      return;
    }

    if (e.key === 'ArrowUp') { e.preventDefault(); setActiveMode(state.activeMode - 1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActiveMode(state.activeMode + 1); }
  });

  const btns = document.querySelectorAll('#toolbar-btns .nav-btn');
  function syncToolbarButtons() {
    btns.forEach((b) => {
      const j = b.dataset.jump;
      let act = false;
      if (state.diveActive) act = j === 'dive3d';
      else if (state.academyActive) act = j === 'academy';
      else if (j === 'mode1') act = state.activeMode === 0;
      else if (j === 'mode2') act = state.activeMode === 1;
      else if (j === 'mode3') act = state.activeMode === 2;
      else if (j === 'mode4') act = state.activeMode === 3;
      else if (j === 'mode5') act = state.activeMode === 4;
      b.classList.toggle('active', act);
    });
  }

  btns.forEach((b) => {
    b.addEventListener('click', () => {
      const j = b.dataset.jump;
      state.diveActive = false;
      state.academyActive = false;
      if (j === 'mode1') setActiveMode(0);
      else if (j === 'mode2') setActiveMode(1);
      else if (j === 'mode3') setActiveMode(2);
      else if (j === 'mode4') setActiveMode(3);
      else if (j === 'mode5') setActiveMode(4);
      else if (j === 'academy') { setActiveMode(2); launchAcademy(); }
      else if (j === 'dive3d') { setActiveMode(4); launchDive3D(); }
      syncToolbarButtons();
    });
  });

  syncToolbarButtons();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
